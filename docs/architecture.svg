<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">BayShift shared-state WebMCP architecture</title>
  <desc id="desc">Human operator and browser agent use one React application, one WebMCP bridge, one deterministic domain engine, and one versioned yard state with an audit ledger.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#0b1d30"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e7490"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#047857"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b45309"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity=".5"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#67e8f9"/>
    </marker>
    <style>
      .label{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#e6f6ff}
      .muted{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#9fb7c9}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#b9e9f4}
      .card{fill:#0d2237;stroke:#21425c;stroke-width:2}
      .flow{fill:none;stroke:#67e8f9;stroke-width:4;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="900" rx="34" fill="url(#bg)"/>
  <circle cx="1490" cy="90" r="210" fill="#0e7490" opacity=".08"/>
  <circle cx="100" cy="810" r="240" fill="#10b981" opacity=".06"/>

  <text x="80" y="82" class="label" font-size="38" font-weight="750">BayShift shared-state architecture</text>
  <text x="80" y="122" class="muted" font-size="20">One operational world. Two collaborators. No shadow copy for the agent.</text>

  <g filter="url(#shadow)">
    <rect class="card" x="80" y="190" width="300" height="160" rx="22"/>
    <rect x="104" y="216" width="54" height="54" rx="14" fill="url(#amber)"/>
    <path d="M121 246h20M131 236v20" stroke="#07111f" stroke-width="4" stroke-linecap="round"/>
    <text x="180" y="243" class="label" font-size="25" font-weight="700">Yard operator</text>
    <text x="104" y="302" class="muted" font-size="18">moves · locks · disruptions</text>
    <text x="104" y="330" class="mono" font-size="16">visible human provenance</text>

    <rect class="card" x="80" y="550" width="300" height="160" rx="22"/>
    <rect x="104" y="576" width="54" height="54" rx="14" fill="url(#cyan)"/>
    <path d="M118 604h26M123 595h16M123 613h16" stroke="#07111f" stroke-width="4" stroke-linecap="round"/>
    <text x="180" y="603" class="label" font-size="25" font-weight="700">Browser agent</text>
    <text x="104" y="662" class="muted" font-size="18">inspect · plan · execute</text>
    <text x="104" y="690" class="mono" font-size="16">9 native WebMCP tools</text>

    <rect class="card" x="500" y="170" width="360" height="200" rx="24"/>
    <text x="532" y="214" class="label" font-size="25" font-weight="700">React operator surface</text>
    <text x="532" y="255" class="muted" font-size="18">2.5D live yard · queue · ledger</text>
    <text x="532" y="288" class="muted" font-size="18">plan preview · tool trace · rewind</text>
    <rect x="532" y="315" width="286" height="30" rx="15" fill="#0b3346"/>
    <text x="548" y="336" class="mono" font-size="15">human intent → domain command</text>

    <rect class="card" x="500" y="530" width="360" height="200" rx="24"/>
    <text x="532" y="574" class="label" font-size="25" font-weight="700">Native WebMCP bridge</text>
    <text x="532" y="615" class="muted" font-size="18">document.modelContext.registerTool</text>
    <text x="532" y="648" class="muted" font-size="18">strict schemas · read/write hints</text>
    <rect x="532" y="675" width="286" height="30" rx="15" fill="#0b3346"/>
    <text x="548" y="696" class="mono" font-size="15">tool call → domain command</text>

    <rect x="990" y="250" width="470" height="250" rx="28" fill="#0c2935" stroke="#22d3ee" stroke-width="3" filter="url(#shadow)"/>
    <rect x="1022" y="282" width="60" height="60" rx="16" fill="url(#green)"/>
    <path d="M1037 311l10 10 22-25" fill="none" stroke="#06241c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1104" y="309" class="label" font-size="28" font-weight="750">Authoritative domain engine</text>
    <text x="1022" y="382" class="muted" font-size="19">LIFO · height · locks · weight · compatibility</text>
    <text x="1022" y="416" class="muted" font-size="19">deterministic planning · atomic mutation · rewind</text>
    <rect x="1022" y="444" width="388" height="32" rx="16" fill="#0d3a3a"/>
    <text x="1040" y="466" class="mono" font-size="16">same validation for HUMAN and AGENT</text>

    <rect class="card" x="990" y="585" width="470" height="150" rx="24"/>
    <text x="1022" y="628" class="label" font-size="24" font-weight="700">Versioned yard state + audit ledger</text>
    <text x="1022" y="667" class="muted" font-size="18">stateVersion · actor · before/after · changed entities</text>
    <text x="1022" y="701" class="mono" font-size="16">stale command → reject → inspect → replan</text>
  </g>

  <path class="flow" d="M380 270 C430 270 450 270 500 270"/>
  <path class="flow" d="M380 630 C430 630 450 630 500 630"/>
  <path class="flow" d="M860 270 C915 270 935 320 990 340"/>
  <path class="flow" d="M860 630 C920 630 935 465 990 430"/>
  <path class="flow" d="M1225 500 L1225 585"/>
  <path d="M990 675 C910 790 700 810 610 730" fill="none" stroke="#fbbf24" stroke-width="3" stroke-dasharray="10 10" marker-end="url(#arrow)"/>
  <text x="650" y="805" class="label" font-size="18" font-weight="650">conflict feedback keeps plans honest</text>

  <rect x="80" y="805" width="430" height="48" rx="24" fill="#10283d" stroke="#234c67"/>
  <circle cx="110" cy="829" r="8" fill="#34d399"/>
  <text x="132" y="836" class="label" font-size="18" font-weight="650">Successful mutation increments stateVersion</text>
</svg>